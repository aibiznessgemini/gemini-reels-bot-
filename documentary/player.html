<!doctype html>
<html><head><meta charset="utf-8"><title>documentary player</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import * as E from '/engine/engine.js';
const F = '/node_modules/@fontsource/';
const fonts = [
  ['OldStd', F + 'old-standard-tt/files/old-standard-tt-latin-400-normal.woff2', { weight: '400' }],
  ['OldStd', F + 'old-standard-tt/files/old-standard-tt-latin-700-normal.woff2', { weight: '700' }],
  ['OldStd', F + 'old-standard-tt/files/old-standard-tt-latin-400-italic.woff2', { weight: '400', style: 'italic' }],
  ['Anton', F + 'anton/files/anton-latin-400-normal.woff2', {}],
  ['Marker', F + 'permanent-marker/files/permanent-marker-latin-400-normal.woff2', {}],
  ['Typewriter', F + 'special-elite/files/special-elite-latin-400-normal.woff2', {}],
  ['Fraktur', F + 'unifrakturmaguntia/files/unifrakturmaguntia-latin-400-normal.woff2', {}],
];
try {
  for (const [fam, url, d] of fonts) { const f = new FontFace(fam, `url(${url})`, d); await f.load(); document.fonts.add(f); }
  const tm = await fetch('/project/timings.json').then(r => r.json());
  const film = (await import('/project/film.js')).default;
  const T = E.makeTimeline(tm);
  await E.build(T, film);
  E.init(document.getElementById('c'));
  window.DURATION = tm.duration;
  window.TOTAL_FRAMES = Math.round(tm.duration * E.FPS);
  window.renderFrame = i => E.render(i / E.FPS);
  window.grab = (q = 0.93) => document.getElementById('c').toDataURL('image/jpeg', q);
  window.grabPNG = () => document.getElementById('c').toDataURL('image/png');
  window.CUES = E.state.cues.sort((a, b) => a.t - b.t);
  window.BEATS = E.beatTable();
  window.ERRORS = T.errors;
  window.READY = true;
} catch (e) { window.BOOT_ERROR = String(e && e.stack || e); }
</script></body></html>
